<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="pedido.css">
</head>
<body>
      <header id="inicio">
        <h1>Gestión de Sorrentinos</h1>
    </header>


    <section id="registrar-pedido">

        <h2>Registrar nuevo pedido</h2>

        <form action="#" method="post">

            <div>
                <label for="cliente">Cliente:</label>

                <input
                    type="text"
                    id="cliente"
                    name="cliente"
                    placeholder="Nombre del cliente"
                    required
                >
            </div>

            <div>
                <label for="fecha-entrega">Fecha de entrega:</label>

                <input
                    type="date"
                    id="fecha-entrega"
                    name="fecha_entrega"
                    required
                >
            </div>

            <div>
                <label for="jamon-queso"> Jamon y Queso </label>
                <input type="number" id="jamon-queso" name="cantidad_jamon-queso" min="0" step="1" value="0">
                  <label for="calabaza"> Calabaza </label>
                <input type="number" id="calabaza" name="cantidad_calabaza" min="0" step="1" value="0">
                  <label for="caprese"> Caprese </label>
                <input type="number" id="caprese" name="cantidad_caprese" min="0" step="1" value="0">
                
            </div>

            <div>
                <label for="observaciones">Observaciones:</label>

                <textarea
                    id="observaciones"
                    name="observaciones"
                    rows="4"
                    placeholder="Aclaraciones sobre el pedido"
                ></textarea>
            </div>

            <button type="submit">
                Guardar pedido
            </button>

            <button type="reset">
                Limpiar formulario
            </button>

        </form>

        <a href="index.html">Volver al inicio</a>

    </section>

</body>
</html>
